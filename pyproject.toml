[project]
name = "agent-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matias Vinales" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent-langchain = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
